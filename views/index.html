<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-book-bookmark text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white">Books Manager</h1>
          <p class="text-xs text-slate-400">Powered by Go Fiber v3 & SQLite</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <a href="/swagger/index.html" target="_blank" class="text-xs text-slate-400 hover:text-slate-200 border border-slate-700 hover:border-slate-600 px-3 py-2 rounded-lg transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-code"></i> Swagger API
        </a>
        <button onclick="openCreateModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-lg shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Book
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <!-- Top Stats / Filter Bar -->
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <span class="text-sm text-slate-400">Total Books: <span id="booksCount" class="font-bold text-white">0</span></span>
      </div>
      <div class="relative w-full sm:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()"
          placeholder="Search by title or author..." 
          class="w-full bg-slate-800/80 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
        />
      </div>
    </div>

    <!-- Books List Table -->
    <div class="bg-slate-800/40 border border-slate-800 rounded-xl overflow-hidden shadow-xl backdrop-blur">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-800/80 text-xs uppercase text-slate-400 border-b border-slate-700/60 tracking-wider">
            <tr>
              <th class="py-3.5 px-4 w-16">ID</th>
              <th class="py-3.5 px-4">Title</th>
              <th class="py-3.5 px-4">Author</th>
              <th class="py-3.5 px-4 w-28 text-center">Year</th>
              <th class="py-3.5 px-4 w-32 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="booksTableBody" class="divide-y divide-slate-800/60">
            <!-- Loading state -->
            <tr>
              <td colspan="5" class="py-12 text-center text-slate-500">
                <i class="fa-solid fa-circle-notch fa-spin text-xl mb-2 text-indigo-500"></i>
                <p>Loading books from database...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Form (Create / Edit) -->
  <div id="bookModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl relative animate-in fade-in zoom-in duration-150">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h2 id="modalTitle" class="text-lg font-bold text-white mb-1">Add New Book</h2>
      <p id="modalSubtitle" class="text-xs text-slate-400 mb-6">Enter book metadata to store in SQLite</p>

      <form id="bookForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="bookId" />

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Book Title <span class="text-rose-500">*</span></label>
          <input 
            type="text" 
            id="titleInput" 
            required 
            placeholder="e.g. Designing Data-Intensive Applications" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Author <span class="text-rose-500">*</span></label>
          <input 
            type="text" 
            id="authorInput" 
            required 
            placeholder="e.g. Martin Kleppmann" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Publication Year</label>
          <input 
            type="number" 
            id="yearInput" 
            placeholder="e.g. 2017" 
            min="1000" 
            max="2099" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
          />
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-700/60 mt-6">
          <button 
            type="button" 
            onclick="closeModal()" 
            class="px-4 py-2 text-xs font-medium text-slate-300 hover:text-white bg-slate-700/60 hover:bg-slate-700 rounded-lg transition-colors"
          >
            Cancel
          </button>
          <button 
            type="submit" 
            id="submitBtn" 
            class="px-5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2"
          >
            Save Book
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-slate-800 border border-slate-700 shadow-2xl rounded-xl px-4 py-3 text-sm flex items-center gap-3">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg" class="text-slate-200">Book created successfully</span>
  </div>

  <script>
    let allBooks = [];

    // Fetch and render books on page load
    async function fetchBooks() {
      try {
        const res = await fetch('/api/books');
        if (!res.ok) throw new Error('Failed to fetch books');
        allBooks = await res.json();
        renderBooks(allBooks);
      } catch (err) {
        showToast(err.message, true);
        document.getElementById('booksTableBody').innerHTML = `
          <tr><td colspan="5" class="py-12 text-center text-rose-400">Failed to load books. Please refresh.</td></tr>
        `;
      }
    }

    function renderBooks(books) {
      const tbody = document.getElementById('booksTableBody');
      document.getElementById('booksCount').textContent = books.length;

      if (books.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-16 text-center text-slate-500">
              <i class="fa-solid fa-book-open text-3xl mb-3 block text-slate-600"></i>
              <p class="font-medium text-slate-400">No books found</p>
              <p class="text-xs mt-1">Click "Add Book" above to insert your first record into SQLite.</p>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = books.map(book => `
        <tr class="hover:bg-slate-800/40 transition-colors">
          <td class="py-3 px-4 font-mono text-xs text-slate-500">#${book.id}</td>
          <td class="py-3 px-4 font-medium text-white">${escapeHtml(book.title)}</td>
          <td class="py-3 px-4 text-slate-300">${escapeHtml(book.author)}</td>
          <td class="py-3 px-4 text-center">
            ${book.year ? `<span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full text-xs font-mono font-medium">${book.year}</span>` : '<span class="text-slate-600 text-xs">—</span>'}
          </td>
          <td class="py-3 px-4 text-right">
            <div class="inline-flex items-center gap-1.5">
              <button 
                onclick="openEditModal(${book.id})" 
                title="Edit book"
                class="p-1.5 hover:bg-slate-700/80 rounded-lg text-slate-400 hover:text-indigo-400 transition-colors"
              >
                <i class="fa-solid fa-pen-to-square text-xs"></i>
              </button>
              <button 
                onclick="deleteBook(${book.id})" 
                title="Delete book"
                class="p-1.5 hover:bg-slate-700/80 rounded-lg text-slate-400 hover:text-rose-400 transition-colors"
              >
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        renderBooks(allBooks);
        return;
      }
      const filtered = allBooks.filter(b => 
        (b.title && b.title.toLowerCase().includes(q)) || 
        (b.author && b.author.toLowerCase().includes(q))
      );
      renderBooks(filtered);
    }

    function openCreateModal() {
      document.getElementById('modalTitle').textContent = 'Add New Book';
      document.getElementById('modalSubtitle').textContent = 'Enter details to insert a new book into SQLite';
      document.getElementById('bookId').value = '';
      document.getElementById('titleInput').value = '';
      document.getElementById('authorInput').value = '';
      document.getElementById('yearInput').value = '';
      document.getElementById('bookModal').classList.remove('hidden');
      document.getElementById('titleInput').focus();
    }

    function openEditModal(id) {
      const book = allBooks.find(b => b.id === id);
      if (!book) return;

      document.getElementById('modalTitle').textContent = 'Edit Book';
      document.getElementById('modalSubtitle').textContent = `Updating book #${id}`;
      document.getElementById('bookId').value = book.id;
      document.getElementById('titleInput').value = book.title || '';
      document.getElementById('authorInput').value = book.author || '';
      document.getElementById('yearInput').value = book.year || '';
      document.getElementById('bookModal').classList.remove('hidden');
      document.getElementById('titleInput').focus();
    }

    function closeModal() {
      document.getElementById('bookModal').classList.add('hidden');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('bookId').value;
      const title = document.getElementById('titleInput').value.trim();
      const author = document.getElementById('authorInput').value.trim();
      const year = parseInt(document.getElementById('yearInput').value, 10) || 0;

      const payload = { title, author, year };
      const isEdit = Boolean(id);
      const url = isEdit ? `/api/books/${id}` : '/api/books';
      const method = isEdit ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Request failed');
        }

        closeModal();
        showToast(isEdit ? 'Book updated successfully' : 'Book added successfully');
        await fetchBooks();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function deleteBook(id) {
      const book = allBooks.find(b => b.id === id);
      const title = book ? `"${book.title}"` : `Book #${id}`;
      if (!confirm(`Are you sure you want to delete ${title}?`)) return;

      try {
        const res = await fetch(`/api/books/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete book');
        showToast('Book deleted');
        await fetchBooks();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      const text = document.getElementById('toastMsg');

      text.textContent = msg;
      icon.className = isError 
        ? 'fa-solid fa-circle-exclamation text-rose-400' 
        : 'fa-solid fa-circle-check text-emerald-400';

      toast.classList.remove('hidden');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial load
    fetchBooks();
  </script>
</body>
</html>
